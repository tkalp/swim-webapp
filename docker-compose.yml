version: '3.8'

services:
  # PostgreSQL - Primary database
  postgres:
    image: postgres:16-alpine
    container_name: aquilus-postgres
    environment:
      POSTGRES_USER: aquilus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquilus}
      POSTGRES_DB: aquilus
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - aquilus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquilus"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend - Nginx serving static files
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_MIXPANEL_TOKEN=${VITE_MIXPANEL_TOKEN}
    container_name: aquilus-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aquilus-network

  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquilus-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://aquilus:${POSTGRES_PASSWORD:-aquilus}@postgres:5432/aquilus
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - aquilus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - Message broker for Celery
  redis:
    image: redis:7-alpine
    container_name: aquilus-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - aquilus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Worker - Celery worker for background tasks
  worker:
    mem_limit: 1g
    mem_reservation: 512m
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    container_name: aquilus-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://aquilus:${POSTGRES_PASSWORD:-aquilus}@postgres:5432/aquilus
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SWIMRANKINGS_EMAIL=${SWIMRANKINGS_EMAIL}
      - SWIMRANKINGS_PASSWORD=${SWIMRANKINGS_PASSWORD}
      - CHROMIUM_PATH=/usr/bin/chromium
      - BROWSER_PROFILE_DIR=/tmp/swimrankings_profile
      - AUTO_GEN_DAYS_AHEAD=${AUTO_GEN_DAYS_AHEAD}
      - AUTO_GEN_SCHEDULE_HOUR=${AUTO_GEN_SCHEDULE_HOUR}
      - AUTO_GEN_SCHEDULE_MINUTE=${AUTO_GEN_SCHEDULE_MINUTE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - aquilus-network


networks:
  aquilus-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: